<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chúc mừng sinh nhật • Nguyễn Ngọc Kim Ngân 🎂</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  
</head>
<body>
  <canvas id="confetti"></canvas>
  <div class="blobs"></div>
  <div class="container">
    <div class="card">
      <div class="sparkle"></div>
      <div class="balloons">
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="balloon"></div>
      </div>

      <div class="heading">
        <span class="badge">Happy Birthday Em Iu</span>
        <h1>Chúc mừng sinh nhật <span class="signature">Nguyễn Ngọc Kim Ngân</span> 🎉</h1>
      </div>
      <p class="sub">Chúc EM thêm tuổi mới luôn rạng rỡ, hạnh phúc, vui vẻ và học thật giỏi 💖</p>

      <div class="actions">
        <button class="btn" id="btnConfetti">Pháo giấy 🎊</button>
      </div>

      <div class="grid">
        <div class="wish" id="wishBox">
          🌟 "Em yêu, hôm nay là ngày đặc biệt của em. Anh chúc em mãi xinh đẹp, dễ thương và được anh thương hoài không hết." 
        </div>
        <!-- <div class="photo" id="photo">
          <div class="placeholder">Bạn có thể kéo & thả ảnh (*.jpg, *.png) vào đây để hiển thị khung ảnh kỷ niệm 🎁</div>
        </div> -->
      </div>

      <footer>Mãi iu cún 💝</footer>
    </div>
  </div>

  <script src="./main.js"></script>
</body>
</html>
